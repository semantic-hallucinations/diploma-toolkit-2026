name: Compiler

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and compile ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build compiler image
        uses: docker/build-push-action@v6
        with:
          context: compiler
          file: compiler/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: diploma-toolkit/compiler:local

      - name: Compile example project
        run: |
          mkdir -p /tmp/diploma-output
          python3 compiler/diploma_compile.py examples/diploma_template \
            -o /tmp/diploma-output \
            --no-auto-build
          test -s /tmp/diploma-output/diploma_template.pdf
