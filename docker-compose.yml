services:
  compiler:
    image: diploma-toolkit/compiler:local
    build:
      context: ./compiler
    network_mode: none
    init: true
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "trap 'exit 0' INT TERM; while true; do sleep 86400 & wait $$!; done"
    volumes:
      - ./compiler-output:/out
